name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  verify:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml is $version but tag is $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev pkg-config

      - name: Build universal macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

          mkdir -p dist
          app="dist/Quirpy.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/Quirpy" \
            target/aarch64-apple-darwin/release/Quirpy \
            target/x86_64-apple-darwin/release/Quirpy

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Quirpy</string>
            <key>CFBundleExecutable</key><string>Quirpy</string>
            <key>CFBundleIdentifier</key><string>com.graviadaemon.quirpy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "dist/Quirpy-v${VERSION}-macos-universal.zip"
          rm -rf "$app"

      - name: Build Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          mkdir -p dist/stage
          cp target/release/Quirpy.exe LICENSE README.md dist/stage/
          cd dist/stage
          7z a "../Quirpy-v${VERSION}-windows-x86_64.zip" ./*
          cd ..
          rm -rf stage

      - name: Build Linux tarball and AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build --release

          mkdir -p dist/stage
          cp target/release/Quirpy LICENSE README.md dist/stage/
          tar -czf "dist/Quirpy-v${VERSION}-linux-x86_64.tar.gz" -C dist/stage .
          rm -rf dist/stage

          mkdir -p AppDir/usr/bin
          cp target/release/Quirpy AppDir/usr/bin/Quirpy
          cp packaging/linux/quirpy.desktop AppDir/quirpy.desktop
          cp packaging/linux/quirpy.png AppDir/quirpy.png
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/Quirpy" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir \
            "dist/Quirpy-v${VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: quirpy-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - id: prerelease
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          case "$VERSION" in
            0.*) echo "value=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "value=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
